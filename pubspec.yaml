name: flutter_interfaces
description: "Aplicación Flutter con interfaz moderna azul marino digital."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  math_expressions: ^2.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icono/mi_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icono/mi_logo.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icono/mi_logo.png"
